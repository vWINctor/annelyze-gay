<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Diário com Cadeado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home" data-page="cadastro">
  <header class="site-header">
    <a class="logo" href="index.html">Diário com Cadeado</a>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html" id="linkInicio">Início</a></li>
        <li id="itemLogin"><a href="login.html">Login</a></li>
        <li><a href="#" id="btn-sobre">Sobre</a></li>
        <li><a href="#" id="btn-contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- Aba Lateral Esquerda (Sidebar) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar-left" id="sidebarLeft" aria-label="Menu lateral">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button type="button" class="sidebar-close" id="sidebarFechar" aria-label="Fechar menu">✕</button>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-section" id="sidebar-secao-sobre">
        <h3>Sobre</h3>
        <ul>
          <li><a href="#" data-info="empresa">Empresa</a></li>
          <li><a href="#" data-info="clientes">Clientes</a></li>
        </ul>
      </div>
      <div class="sidebar-section" id="sidebar-secao-contato">
        <h3>Contato</h3>
        <ul>
          <li><a href="#" data-info="telefones">Telefones</a></li>
          <li><a href="#" data-info="email">Email</a></li>
        </ul>
      </div>
    </div>
  </aside>

  <main>
    <section class="card">
      <h1>Cadastro</h1>
      <form id="formCadastro" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="voce@email.com">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha">

        <p class="msg" id="mensagem" role="alert"></p>

        <button type="submit" class="btn">Cadastrar</button>
        <a href="index.html" class="btn btn-secondary">Voltar para Início</a>
      </form>
    </section>
  </main>

  <!-- Modal Central -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button type="button" class="modal-close" id="modalFechar" aria-label="Fechar">✕</button>
      <div id="modalConteudo"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Hoje é <span id="dataAtual"></span>. Todos os direitos reservados. Desenvolvido por: Víctor de Morais, Annelyze.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
